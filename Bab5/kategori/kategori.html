    <h1 class="page-title">Kategori Wisata</h1>

    <div class="wisata-card table-scroll">

            <th>Kategori</th>
            <th>Warna</th>
            <th>Dibuat</th>
            <th class="col-aksi">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-no no">1</td>
            <td class="nama">Pantai</td>
            <td><span class="warna" style="--warna:#2563eb"><i></i>Biru</span></td>
            <td class="tanggal">12 Jan 2024</td>
            <td class="col-aksi">
              <div class="aksi">
                <a href="edit-kategori.html?id=1" class="btn-aksi btn-edit" aria-label="Edit Pantai"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
                <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus Pantai"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1zm4 2v8h1.500v-8zm3 0v8H15v-8z"/></svg></button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="col-no no">2</td>
            <td class="nama">Gunung</td>
            <td><span class="warna" style="--warna:#16a34a"><i></i>Hijau</span></td>
            <td class="tanggal">14 Jan 2024</td>
            <td class="col-aksi">
              <div class="aksi">
                <a href="edit-kategori.html?id=2" class="btn-aksi btn-edit" aria-label="Edit Gunung"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
                <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus Gunung"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1zm4 2v8h1.500v-8zm3 0v8H15v-8z"/></svg></button>
              </div>
            </td>
          </tr>
          <tr>
            <td class="col-no no">3</td>
            <td class="nama">Coban</td>
            <td><span class="warna" style="--warna:#9333ea"><i></i>Ungu</span></td>
            <td class="tanggal">16 Jan 2024</td>
            <td class="col-aksi">
              <div class="aksi">
                <a href="edit-kategori.html?id=3" class="btn-aksi btn-edit" aria-label="Edit Coban"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
                <button type="button" class="btn-aksi btn-hapus" aria-label="Hapus Coban"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1zm4 2v8h1.500v-8zm3 0v8H15v-8z"/></svg></button>

            </td>
          </tr>
          <tr>
            <td class="col-no no">4</td>
            <td class="nama">Alam</td>
            <td><span class="warna" style="--warna:#10b981"><i></i>Hijau muda</span></td>
            <td class="tanggal">18 Jan 2024</td>
            <td class="col-aksi">
              <div class="aksi">
                <a href="edit-kategori.html?id=4" class="btn-aksi btn-edit" aria-label="Edit Alam"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>

            <td class="tanggal">20 Jan 2024</td>
            <td class="col-aksi">
              <div class="aksi">
                <a href="edit-kategori.html?id=5" class="btn-aksi btn-edit" aria-label="Edit Cafe"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>

      <p class="kosong" id="kosong" hidden>Kategori tidak ditemukan.</p>
    </div>
  </div>

  <script>
    var tabel = document.getElementById('tabelKategori');

    function nomori() {
      var no = 0;
      tabel.querySelectorAll('tbody tr').forEach(function (tr) {
        if (tr.hidden) return;
        tr.querySelector('.no').textContent = ++no;
      });
      document.getElementById('kosong').hidden = no > 0;
    }

    // Cari kategori
    document.getElementById('cari').addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      tabel.querySelectorAll('tbody tr').forEach(function (tr) {
        tr.hidden = tr.querySelector('.nama').textContent.toLowerCase().indexOf(q) === -1;
      });
      nomori();
    });

    // Hapus kategori setelah konfirmasi
    tabel.addEventListener('click', function (e) {
      var tombol = e.target.closest('.btn-hapus');
      if (!tombol) return;
      var tr = tombol.closest('tr');
      var nama = tr.querySelector('.nama').textContent;
      if (!confirm('Hapus kategori "' + nama + '"?')) return;
      // TODO: kirim permintaan hapus ke server di sini
      tr.remove();
      nomori();
    });
  </script>
